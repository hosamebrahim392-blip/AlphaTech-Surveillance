<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مخطط CamZone ثلاثي الأبعاد الاحترافي</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #050811;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        /* لوحة التحكم الجانبية المتطورة */
        #control-panel {
            position: absolute;
            top: 20px;
            right: 20px;
            width: 280px;
            background: rgba(10, 15, 29, 0.93);
            border: 2px solid #ff6600;
            box-shadow: 0 0 15px rgba(255, 102, 0, 0.3);
            border-radius: 12px;
            padding: 15px;
            color: white;
            z-index: 100;
        }
        h1 { margin: 0 0 5px 0; font-size: 18px; color: #ff6600; text-shadow: 0 0 8px rgba(255,102,0,0.5); }
        .sub-title { font-size: 11px; color: #00ccff; margin-bottom: 15px; }
        .control-group { margin-bottom: 12px; }
        label { display: block; font-size: 12px; margin-bottom: 5px; color: #ccc; }
        input[type="range"] { width: 100%; accent-color: #ff6600; }
        /* حاوية العرض */
        #canvas-container {
            width: 100vw;
            height: 100vh;
        }
    </style>
    <!-- استدعاء أحدث مكتبات Three.js المستقرة -->
    <script src="https://cloudflare.com"></script>
    <script src="https://jsdelivr.net"></script>
</head>
<body>

    <div id="control-panel">
        <h1>CamZone 3D Engine Pro</h1>
        <div class="sub-title">نظام محاكاة وتخطيط الأنظمة الأمنية الذكي</div>
        
        <div class="control-group">
            <label id="fov-label">زاوية رؤية عدسة الكاميرا (FOV): 60°</label>
            <input type="range" id="fov-slider" min="30" max="120" value="60">
        </div>
        <div class="control-group">
            <label id="camX-label">تحريك الكاميرا أفقياً (X): -3.5</label>
            <input type="range" id="camX-slider" min="-3.9" max="3.9" step="0.1" value="-3.5">
        </div>
        <div class="control-group">
            <label id="camRot-label">تدوير زاوية الكاميرا: 45°</label>
            <input type="range" id="camRot-slider" min="0" max="90" value="45">
        </div>
    </div>

    <div id="canvas-container"></div>

    <script>
        // 1. المحرك الرئيسي وإعدادات الجودة الفائقة (Ultra Settings)
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x050811, 0.015); // إضافة تأثير ضبابي عميق للواقعية

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(10, 12, 14);

        const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(window.devicePixelRatio); // دقة بيكسل كاملة فائقة النقاء
        renderer.shadowMap.enabled = true; // تفعيل محرك الظلال الحقيقية
        renderer.shadowMap.type = THREE.PCFSoftShadowMap; 
        container.appendChild(renderer.domElement);

        // 2. التحكم المتقدم بالكاميرا
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.03;

        // 3. الإضاءة الاحترافية والظلال (Studio Lighting)
        const ambientLight = new THREE.AmbientLight(0x0a1530, 1.5);
        scene.add(ambientLight);

        // إضاءة نيون موجهة لإنتاج ظلال واقعية للمجسمات
        const dirLight = new THREE.DirectionalLight(0xff6600, 1.2);
        dirLight.position.set(8, 15, 8);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048; // جودة ظلال خارقة
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.camera.near = 0.5;
        dirLight.shadow.camera.far = 25;
        dirLight.shadow.camera.left = -6;
        dirLight.shadow.camera.right = 6;
        dirLight.shadow.camera.top = 6;
        dirLight.shadow.camera.bottom = -6;
        dirLight.shadow.bias = -0.0005;
        scene.add(dirLight);

        // إضاءة نقطية زرقاء خافتة لتعزيز الطابع المستقبلي (Cyberpunk Blue)
        const blueLight = new THREE.PointLight(0x00ccff, 2, 15);
        blueLight.position.set(0, 4, 0);
        scene.add(blueLight);

        // 4. بناء الغرفة بمواد ذات جودة عالية متفاعلة مع الضوء (PBR Materials)
        // الأرضية
        const floorGeo = new THREE.BoxGeometry(10, 0.2, 10);
        const floorMat = new THREE.MeshStandardMaterial({ 
            color: 0x0f172a, 
            roughness: 0.2, // لمعان ممتاز يعكس ضوء النيون
            metalness: 0.5 
        });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.receiveShadow = true;
        scene.add(floor);

        // شبكة التخطيط المهندسة المهيأة ثلاثية الأبعاد
        const grid = new THREE.GridHelper(10, 20, 0xff6600, 0x1e293b);
        grid.position.y = 0.11;
        scene.add(grid);

        // الجدران المتطابقة
        const wallMat = new THREE.MeshStandardMaterial({ color: 0x131b2e, roughness: 0.5 });
        
        const backWall = new THREE.Mesh(new THREE.BoxGeometry(10, 5, 0.2), wallMat);
        backWall.position.set(0, 2.5, -5);
        backWall.receiveShadow = true;
        scene.add(backWall);

        const leftWall = new THREE.Mesh(new THREE.BoxGeometry(0.2, 5, 10), wallMat);
        leftWall.position.set(-5, 2.5, 0);
        leftWall.receiveShadow = true;
        scene.add(leftWall);

        // 5. هيكل الكاميرا ومحاكاة مجال الرؤية (FOV Structure)
        const cameraGroup = new THREE.Group();
        
        // جسم الكاميرا الرئيسي
        const camBody = new THREE.Mesh(
            new THREE.CylinderGeometry(0.25, 0.25, 0.8, 32),
            new THREE.MeshStandardMaterial({ color: 0xff6600, metalness: 0.8, roughness: 0.1 })
        );
        camBody.rotation.x = Math.PI / 3;
        camBody.castShadow = true;
        cameraGroup.add(camBody);

        // عدسة الكاميرا السوداء
        const lens = new THREE.Mesh(
            new THREE.CylinderGeometry(0.2, 0.2, 0.1, 32),
            new THREE.MeshBasicMaterial({ color: 0x000000 })
        );
        lens.position.set(0, -0.4, 0.2);
        lens.rotation.x = Math.PI / 3;
        cameraGroup.add(lens);

        cameraGroup.position.set(-3.5, 4.5, -4.5);
        scene.add(cameraGroup);

        // 6. صناعة هرم مخروط الرؤية الفعلي (FOV Simulation Pyramid)
        let fovGeometry = new THREE.ConeGeometry(4, 7, 4, 1);
        const fovMaterial = new THREE.MeshBasicMaterial({
            color: 0x00ccff,
            transparent: true,
            opacity: 0.25, // شفافية تحاكي أشعة الضوء أو الليزر المخروطي
            wireframe: false,
            side: THREE.DoubleSide
        });
        let fovMesh = new THREE.Mesh(fovGeometry, fovMaterial);
        
        // إعداد موضع الهرم ليتطابق مع اتجاه عدسة الكاميرا تماماً
        fovMesh.position.set(0, -3.5, 2);
        fovMesh.rotation.x = Math.PI / 2;
        cameraGroup.add(fovMesh);

        // 7. سلك التوصيل الديناميكي ثلاثي الأبعاد السميك (Tubular Cable Path)
        const cablePoints = [
            new THREE.Vector3(-3.5, 4.5, -4.5),
            new THREE.Vector3(4.8, 4.5, -4.5),
            new THREE.Vector3(4.8, 0.1, -4.5)
        ];
        const cableCurve = new THREE.CatmullRomCurve3(cablePoints);
        const cableGeometry = new THREE.TubeGeometry(cableCurve, 64, 0.06, 8, false); // سلك ثلاثي أبعاد مجسم وليس مجرد خط
        const cableMaterial = new THREE.MeshStandardMaterial({ color: 0x00ccff, emissive: 0x006699 });
        const cableMesh = new THREE.Mesh(cableGeometry, cableMaterial);
        cableMesh.castShadow = true;
        scene.add(cableMesh);

        // 8. التفاعل وربط لوحة التحكم بالتأثيرات الحية (UI Logic)
        const fovSlider = document.getElementById('fov-slider');
        const camXSlider = document.getElementById('camX-slider');
        const camRotSlider = document.getElementById('camRot-slider');

        fovSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('fov-label').innerText = `زاوية رؤية عدسة الكاميرا (FOV): ${val}°`;
            // تغيير حجم مخروط الرؤية ديناميكياً ليحاكي العدسات العريضة والضيقة
            const scaleFactor = val / 60;
            fovMesh.scale.set(scaleFactor, 1, scaleFactor);
        });

        camXSlider.addEventListener('input', (e) => {
            const val = parseFloat(e.target.value);
            document.getElementById('camX-label').innerText = `تحريك الكاميرا أفقياً (X): ${val}`;
            cameraGroup.position.x = val;
        });

        camRotSlider.addEventListener('input', (e) => {
            const val = e.target.value;
            document.getElementById('camRot-label').innerText = `تدوير زاوية الكاميرا: ${val}°`;
            cameraGroup.rotation.y = THREE.MathUtils.degToRad(val - 45);
        });

        // 9. حلقة التحديث المستمر ومحاكاة الإطارات العالية (60 FPS Render Loop)
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
