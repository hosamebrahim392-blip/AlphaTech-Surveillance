<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamZone | مخطط شبكات الموبايل المتكامل</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://cloudflare.com"></script>
    <style>
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #090d16; 
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            overscroll-behavior-y: contain; 
        }

        h1 { font-size: 20px; margin-bottom: 5px; color: #f8fafc; text-align: center; }
        p { font-size: 13px; color: #94a3b8; margin: 0 0 15px 0; text-align: center; }

        .controls {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 420px;
        }

        button, .file-label {
            flex: 1;
            min-width: 90px;
            padding: 12px 5px;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 12px;
            cursor: pointer;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }

        .btn-cam { background-color: #0284c7; } 
        .btn-dvr { background-color: #dc2626; } 
        .btn-wire { background-color: #16a34a; } 
        .btn-upload { background-color: #6b21a8; display: inline-block; }

        button:active, .file-label:active { 
            transform: scale(0.95);
            filter: brightness(1.2); 
        }

        #upload-plan { display: none; }

        #canvas-container {
            border: 3px solid #334155; 
            background-color: #e2e8f0; 
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }
    </style>
</head>
<body>

    <h1>مخطط شبكات <span style="color: #0ea5e9;">Cam</span><span style="color: #22c55e;">Zone</span></h1>
    <p>ارفع كروكي الموقع ثم وزع الكاميرات وشد الأسلاك بإصبعك</p>

    <div class="controls">
        <!-- زر رفع كروكي أو مخطط الموقع -->
        <label for="upload-plan" class="file-label btn-upload">🗺️ رفع المخطط</label>
        <input type="file" id="upload-plan" accept="image/*" onchange="loadBackground(event)">
        
        <button class="btn-cam" onclick="addCamera()">📷 كاميرا</button>
        <button class="btn-dvr" onclick="addDVR()">📟 DVR</button>
        <button class="btn-wire" onclick="startCable()">🧵 سلك</button>
    </div>

    <div id="canvas-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <script>
        const canvasWidth = Math.min(window.innerWidth - 24, 420);
        const canvasHeight = 420;
        
        const canvas = new fabric.Canvas('mapCanvas', {
            width: canvasWidth,
            height: canvasHeight,
            backgroundColor: '#e2e8f0',
            allowTouchScrolling: false 
        });

        // دالة رفع وقراءة صورة مخطط الموقع وجعلها خلفية للوحة الرسم
        function loadBackground(e) {
            const reader = new FileReader();
            reader.onload = function (event) {
                const imgObj = new Image();
                imgObj.src = event.target.result;
                imgObj.onload = function () {
                    const image = new fabric.Image(imgObj);
                    // ضبط مقاس الصورة المرفوعة لتناسب أبعاد اللوحة تماماً
                    image.set({
                        scaleX: canvasWidth / image.width,
                        scaleY: canvasHeight / image.height,
                        selectable: false
                    });
                    canvas.setBackgroundImage(image, canvas.renderAll.bind(canvas));
                }
            }
            reader.readAsDataURL(e.target.files[0]);
        }

        // إضافة كاميرا (تم استبدال الإيموجي بأشكال صريحة لضمان الظهور الفوري)
        function addCamera() {
            const circle = new fabric.Circle({ radius: 16, fill: '#0ea5e9', originX: 'center', originY: 'center' });
            const text = new fabric.Text('CAM', { fontSize: 10, fill: '#ffffff', fontWeight: 'bold', originX: 'center', originY: 'center' });
            
            const camGroup = new fabric.Group([circle, text], {
                left: 50,
                top: 50,
                hasControls: false
            });
            canvas.add(camGroup);
            canvas.setActiveObject(camGroup);
            canvas.renderAll();
        }

        // إضافة DVR بشكل هندسي يظهر على كافة شاشات الهواتف
        function addDVR() {
            const rect = new fabric.Rect({ width: 50, height: 30, fill: '#ef4444', rx: 4, ry: 4, originX: 'center', originY: 'center' });
            const text = new fabric.Text('DVR', { fontSize: 10, fill: '#ffffff', fontWeight: 'bold', originX: 'center', originY: 'center' });
            
            const dvrGroup = new fabric.Group([rect, text], {
                left: 150,
                top: 150,
                hasControls: false
            });
            canvas.add(dvrGroup);
            canvas.setActiveObject(dvrGroup);
            canvas.renderAll();
        }

        // شد سلك مرن وقابل للمط والتحريك باللمس
        function startCable() {
            const line = new fabric.Line([40, 80, 160, 80], {
                strokeWidth: 6, 
                stroke: '#22c55e', 
                originX: 'center',
                originY: 'center',
                hasControls: true, 
                padding: 15 
            });
            canvas.add(line);
            canvas.setActiveObject(line);
            canvas.renderAll();
        }
    </script>
</body>
</html>
