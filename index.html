<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CamZone | نظام تخطيط الشبكات الملون</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <script src="https://cloudflare.com"></script>
    <style>
        /* التوزيع المرن للألوان (غامق، فاتح، زاهي) */
        body {
            font-family: 'Cairo', sans-serif;
            background-color: #090d16; /* لون غامق جداً للخلفية العامة */
            color: #ffffff;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { 
            font-size: 20px; 
            margin-bottom: 5px; 
            color: #f8fafc; /* لون فاتح ناصع للعناوين */
            text-align: center;
        }

        p { 
            font-size: 13px; 
            color: #94a3b8; /* لون رمادي هادي للشروحات */
            margin: 0 0 15px 0; 
            text-align: center; 
        }

        /* أزرار زاهية ملونة لسهولة التمييز */
        .controls {
            display: flex;
            gap: 8px;
            margin-bottom: 15px;
            width: 100%;
            max-width: 420px;
        }

        button {
            flex: 1;
            padding: 12px 5px;
            color: #ffffff;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s;
        }

        /* ألوان الأزرار المخصصة */
        .btn-cam { background-color: #0284c7; } /* أزرق زاهي للكاميرا */
        .btn-dvr { background-color: #dc2626; } /* أحمر غامق للـ DVR */
        .btn-wire { background-color: #16a34a; } /* أخضر زاهي للسلك */

        button:active { 
            transform: scale(0.95);
            filter: brightness(1.2); /* تفتيح الزر عند الضغط */
        }

        /* لوحة رسم فاتحة لتباين مثالي مع الأجهزة الملونة */
        #canvas-container {
            border: 3px solid #334155; /* إطار داكن */
            background-color: #e2e8f0; /* خلفية اللوحة فاتحة ومريحة للرسم */
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

    <h1>مخطط شبكات <span style="color: #0ea5e9;">Cam</span><span style="color: #22c55e;">Zone</span></h1>
    <p>توزيع ألوان ذكي لمساعدة الفني على التخطيط بدون تشتيت</p>

    <div class="controls">
        <button class="btn-cam" onclick="addCamera()">📷 إضافة كاميرا</button>
        <button class="btn-dvr" onclick="addDVR()">📟 إضافة DVR</button>
        <button class="btn-wire" onclick="startCable()">🧵 شد سلك</button>
    </div>

    <div id="canvas-container">
        <canvas id="mapCanvas"></canvas>
    </div>

    <script>
        // ملاءمة حجم شاشات الموبايل
        const canvasWidth = Math.min(window.innerWidth - 24, 420);
        const canvasHeight = 420;
        
        const canvas = new fabric.Canvas('mapCanvas', {
            width: canvasWidth,
            height: canvasHeight,
            backgroundColor: '#e2e8f0' // لوحة فاتحة تظهر عليها العناصر بوضوح
        });

        // إضافة كاميرا بلون أزرق زاهي مائي لسهولة التعرف عليها
        function addCamera() {
            const camGroup = new fabric.Group([
                new fabric.Circle({ radius: 18, fill: '#0ea5e9', originX: 'center', originY: 'center' }),
                new fabric.Text('📷', { fontSize: 16, originX: 'center', originY: 'center' })
            ], {
                left: 40,
                top: 40,
                hasControls: false
            });
            canvas.add(camGroup);
            canvas.setActiveObject(camGroup);
        }

        // إضافة DVR بلون أحمر مرجاني غامق وواضح
        function addDVR() {
            const dvrGroup = new fabric.Group([
                new fabric.Rect({ width: 55, height: 35, fill: '#ef4444', rx: 6, ry: 6, originX: 'center', originY: 'center' }),
                new fabric.Text('DVR', { fontSize: 11, fill: '#ffffff', fontWeight: 'bold', originX: 'center', originY: 'center' })
            ], {
                left: 140,
                top: 140,
                hasControls: false
            });
            canvas.add(dvrGroup);
            canvas.setActiveObject(dvrGroup);
        }

        // شد سلك بلون أخضر نيون فسفوري زاهي جداً ليظهر بوضوح فوق اللوحة الفاتحة
        function startCable() {
            const line = new fabric.Line(, {
                strokeWidth: 4,
                stroke: '#22c55e', 
                originX: 'center',
                originY: 'center',
                hasControls: true 
            });
            canvas.add(line);
            canvas.setActiveObject(line);
        }
    </script>
</body>
</html>
